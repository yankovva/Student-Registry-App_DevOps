
name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  security_tests:

    runs-on: ubuntu-latest

    steps:
    - name: Clone the repository on the run
      uses: actions/checkout@v4
    - name: Use Node.js v23
      uses: actions/setup-node@v4
      with:
        node-version: 23
        cache: 'npm'
    - name: Instal Packages    
      run: npm install
    - name: Run Npm Security Tests 
      run: npm audit  

  build_test:

    runs-on: ubuntu-latest
    needs: security_tests

    steps:
    - name: Clone the repository on the run
      uses: actions/checkout@v4
    - name: Use Node.js v23
      uses: actions/setup-node@v4
      with:
        node-version: 23
        cache: 'npm'
    - name: Instal Packages    
      run: npm install
    - name: Start Frontend   
      run: npm run start &
    - name: Run Test   
      run: npm run test


  
